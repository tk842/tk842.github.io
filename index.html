<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarini Kanapuram | Portfolio</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #eef2ff 50%, #fdf2f8 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent-pink: #ec4899;
      --accent-purple: #8b5cf6;
      --accent-teal: #0d9488;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      line-height: 1.6;
      padding: 3rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      background: var(--card-bg);
      padding: 2.5rem 1.5rem;
      border-radius: 16px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: var(--shadow);
    }

    .profile-img-container {
      width: 150px;
      height: 150px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #d97706, #cc0033, #2563eb, #8b5cf6);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background-color: #fff;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #cc0033 0%, #1e3a8a 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #cc0033;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.3px;
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-weight: 500;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.7;
    }

    section {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.6rem;
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      list-style: none;
    }
